<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New sale – NIMOX ENTERPRISE</title>
<script>try{var t=localStorage.getItem('nimox_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style/style.css">
<script>/* If the browser refused style/style.css (a Windows file-type setting can do this when index.html is opened by double-click), load the built-in copy */if(!getComputedStyle(document.documentElement).getPropertyValue('--nx'))document.write('<script src="style/style.js"><\/script>')</script>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="index.html"><span class="mark">N</span><span>NIMOX ENTERPRISE<small>Inventory &amp; sales</small></span></a>
  <nav class="nav" aria-label="Main"><a href="index.html">Items</a><a href="sale.html" aria-current="page">New sale</a><a href="sales.html">Sales</a><a href="reports.html">Reports</a></nav>
  <div class="acts"><button id="theme" type="button" class="ghost" aria-label="Switch between dark and light theme"></button></div>
</div></header>
<main class="wrap has-bar">
  <div id="banner" class="banner" hidden></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search the item you are selling" aria-label="Search items">
    <select id="cat" aria-label="Category"></select>
  </div>
  <div id="pick" class="picklist"></div>
  <footer class="credit">Developer: Hayford Edoonu</footer>
</main>
<div class="cartbar"><div class="wrap in"><div id="cartsum" class="cartsum"></div><button id="openCart" type="button" class="primary" disabled>Checkout →</button></div></div>
<dialog id="checkout" class="wide" aria-label="Checkout">
  <div class="sheet">
    <h2>Checkout</h2>
    <div id="lines"></div>
    <div class="co">
      <label>Discount (GH₵)<input id="disc" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
      <div><span class="lbl">How is the customer paying?</span>
        <div id="pay" class="seg"><button type="button" data-p="Cash" class="on">Cash</button><button type="button" data-p="MoMo">MoMo</button><button type="button" data-p="Card">Card</button></div></div>
      <label id="paidWrap">Cash received (GH₵) <span class="hint">(optional)</span><input id="paid" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
      <div class="row">
        <label>Customer name <span class="hint">(optional)</span><input id="cname" autocomplete="off"></label>
        <label>Phone <span class="hint">(for WhatsApp receipt)</span><input id="cphone" inputmode="tel" autocomplete="off" placeholder="e.g. 0241234567"></label>
      </div>
      <label>Note <span class="hint">(optional)</span><input id="note" autocomplete="off"></label>
    </div>
    <div id="totals" class="totals"></div>
    <div id="change" class="change"></div>
    <div class="dfoot"><button type="button" id="coClose">Back</button><button type="button" id="complete" class="primary">Complete sale</button></div>
  </div>
</dialog>
<dialog id="rdlg" aria-label="Receipt">
  <div class="sheet">
    <p class="done">✓ Sale completed. Stock has been updated.</p>
    <div id="rbody"></div>
    <div class="dfoot"><button type="button" id="rClose">New sale</button><a id="rWa" class="btn" target="_blank" rel="noopener">WhatsApp</a><button type="button" id="rPrint" class="primary">Print receipt</button></div>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script src="js/db.js"></script>
<script src="js/menu.js"></script>
<script src="js/receipt.js"></script>
<script src="js/sale.js"></script>
<script>
/* DEVELOPER: HAYFORD EDOONU | Phone: +233553246379 | Email: edoonu@gmail.com */
/* If the style or script files are missing, say so in plain words instead of showing a bare page. */
window.addEventListener('load', function () {
  var bar = document.querySelector('.top');
  var styled = bar && getComputedStyle(bar).position === 'sticky';
  var running = typeof DB !== 'undefined' && typeof start === 'function';
  if (styled && running) return;
  var d = document.createElement('div');
  d.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b3261e;color:#fff;font:15px/1.5 Arial,sans-serif;padding:14px 18px');
  d.innerHTML = '<b>NIMOX cannot find some of its files, so only the plain page is showing.</b><br>' +
    '1. If you opened index.html from inside a .zip file: close it, right-click the .zip, choose <b>Extract All</b>, and open index.html from the extracted folder.<br>' +
    '2. Keep the folders <b>js</b>, <b>style</b> and <b>db</b> in the same folder as index.html (do not copy index.html on its own).<br>' +
    '3. Then press F5 to reload.';
  document.body.appendChild(d);
});
</script>
</body>
</html>
